# windows
# https://github.com/rime/weasel/wiki/Weasel-定制化#weaselyaml
# https://github.com/rime/weasel/blob/bf4853dde1a4476489c4d7e85ab9407e5fc7c5f7/output/data/weasel.yaml#L4
#
# 中英策略（global_ascii: false + 方案 ascii_mode reset:1）
# - 终端 / 代码工具：app_options 强制初始英文；vim_mode 下 Esc 回英文
# - 同窗口内切到中文后，Rime 会保持到你手动切回（Shift / Esc），无法“每次获焦强制英文”
# - 浏览器 / 聊天：不写 app_options，互不抢状态
#
# 配色说明：默认 color_format 为 abgr/bgr（0xBBGGRR），注释中的 #RRGGBB 为设计意图

customization:
  distribution_code_name: Weasel
  distribution_version: 0.16.3
  generator: "Weasel::UIStyleSettings"
  modified_time: "Tue Mar 25 12:07:46 2025"
  rime_version: 1.13.1

patch:
  # false：每个应用独立记忆中英文；true：全系统共用一份状态
  global_ascii: false

  preset_color_schemes:
    # ── Violet / 紫罗兰（默认）────────────────────────────────
    # 强调色：#7c5cbf（浅）/ #a78bfa（深），选中底 #5b4b8a
    violet_light:
      name: Violet Light
      author: "dotfile"
      # #3b3348 正文
      text_color: 0x48333b
      candidate_text_color: 0x48333b
      # #fbf8fc 窗体底（微紫白）
      back_color: 0xfcf8fb
      candidate_back_color: 0xfcf8fb
      # #e6ddf0 边框
      border_color: 0xf0dde6
      shadow_color: 0x28000000
      # #9b8fb0 序号
      label_color: 0xb08f9b
      # #a898b8 注释 / 拼音
      comment_text_color: 0xb898a8
      # #7c5cbf 编码高亮
      hilited_text_color: 0xbf5c7c
      # #f3edf8 编码区底
      hilited_back_color: 0xf8edf3
      hilited_shadow_color: 0x00000000
      hilited_candidate_text_color: 0xffffff
      # #5b4b8a 选中底
      hilited_candidate_back_color: 0x8a4b5b
      hilited_candidate_shadow_color: 0x00000000
      # #ddd6fe 选中序号
      hilited_label_color: 0xfed6dd
      # #e9e0ff 选中注释
      hilited_comment_text_color: 0xffe0e9
      # #7c5cbf 左侧标记条
      hilited_mark_color: 0xbf5c7c

    violet_dark:
      name: Violet Dark
      author: "dotfile"
      # #e8e0f0 正文
      text_color: 0xf0e0e8
      candidate_text_color: 0xf0e0e8
      # #1a1625 窗体底
      back_color: 0x25161a
      candidate_back_color: 0x25161a
      # #2d2640 边框
      border_color: 0x40262d
      shadow_color: 0x48000000
      # #8b7fa0 序号
      label_color: 0xa07f8b
      # #8b7fa0 注释
      comment_text_color: 0xa07f8b
      # #c4b5fd 编码高亮
      hilited_text_color: 0xfdb5c4
      # #252033 编码区底
      hilited_back_color: 0x332025
      hilited_shadow_color: 0x00000000
      hilited_candidate_text_color: 0xffffff
      # #5b4b8a 选中底
      hilited_candidate_back_color: 0x8a4b5b
      hilited_candidate_shadow_color: 0x00000000
      # #c4b5fd 选中序号
      hilited_label_color: 0xfdb5c4
      # #d4c4e8 选中注释
      hilited_comment_text_color: 0xe8c4d4
      # #a78bfa 左侧标记条
      hilited_mark_color: 0xfa8ba7

    # ── Vitesse（备用，可在设定里切换）────────────────────────
    vitesse_light:
      name: Vitesse Light
      author: "based on Anthony Fu Vitesse"
      text_color: 0x343a39
      candidate_text_color: 0x343a39
      back_color: 0xfbfbfb
      candidate_back_color: 0xfbfbfb
      border_color: 0xe0e5e5
      shadow_color: 0x28000000
      label_color: 0x98a0a0
      comment_text_color: 0xa0ada0
      hilited_text_color: 0x486b1c
      hilited_back_color: 0xebf0f0
      hilited_shadow_color: 0x00000000
      hilited_candidate_text_color: 0xffffff
      hilited_candidate_back_color: 0x343a39
      hilited_candidate_shadow_color: 0x00000000
      hilited_label_color: 0x75934d
      hilited_comment_text_color: 0xc0cfc8
      hilited_mark_color: 0x486b1c

    vitesse_dark:
      name: Vitesse Dark
      author: "based on Anthony Fu Vitesse"
      text_color: 0xcad7db
      candidate_text_color: 0xcad7db
      back_color: 0x1e1e1e
      candidate_back_color: 0x1e1e1e
      border_color: 0x2f2f2f
      shadow_color: 0x40000000
      label_color: 0x758575
      comment_text_color: 0x758575
      hilited_text_color: 0x75934d
      hilited_back_color: 0x2a2a2a
      hilited_shadow_color: 0x00000000
      hilited_candidate_text_color: 0xffffff
      hilited_candidate_back_color: 0x343a39
      hilited_candidate_shadow_color: 0x00000000
      hilited_label_color: 0x75934d
      hilited_comment_text_color: 0xa0ada0
      hilited_mark_color: 0x75934d

  style:
    color_scheme: violet_light
    color_scheme_dark: violet_dark
    color_space: srgb
    # 拉丁优先，中文回退到雅黑，避免缺字
    font_face: "Mozilla Text, Microsoft YaHei UI, Segoe UI Emoji"
    font_point: 12
    label_font_point: 11
    comment_font_point: 11
    horizontal: true
    inline_preedit: true
    # 空字符串 + hilited_mark_color → Win11 风格选中标记
    mark_text: ""
    layout:
      border: 1
      candidate_spacing: 12
      hilite_padding: 8
      hilite_spacing: 6
      margin_x: 8
      margin_y: 6
      round_corner: 6
      corner_radius: 8
      spacing: 6
      shadow_radius: 8
      shadow_offset_x: 1
      shadow_offset_y: 2

  app_options:
    # --- 终端 / 控制台：默认英文 + Esc 回英文（AI 打完中文后可按 Esc）---
    cmd.exe:
      ascii_mode: true
      vim_mode: true
    powershell.exe:
      ascii_mode: true
      vim_mode: true
    pwsh.exe:
      ascii_mode: true
      vim_mode: true
    windowsterminal.exe:
      ascii_mode: true
      vim_mode: true
    conhost.exe:
      ascii_mode: true
      vim_mode: true
    conemu64.exe:
      ascii_mode: true
      vim_mode: true
    conemuc64.exe:
      ascii_mode: true
      vim_mode: true
    mintty.exe:
      ascii_mode: true
      vim_mode: true
    # Warp 全渠道
    warp.exe:
      ascii_mode: true
      vim_mode: true
      inline_preedit: true
    warppreview.exe:
      ascii_mode: true
      vim_mode: true
      inline_preedit: true
    # 其它常见终端
    tabby.exe:
      ascii_mode: true
      vim_mode: true
    hyper.exe:
      ascii_mode: true
      vim_mode: true
    alacritty.exe:
      ascii_mode: true
      vim_mode: true
    wezterm-gui.exe:
      ascii_mode: true
      vim_mode: true
    kitty.exe:
      ascii_mode: true
      vim_mode: true

    # --- 代码编辑器 / IDE：默认英文 + Esc 回英文 ---
    code.exe:
      ascii_mode: true
      vim_mode: true
    code-insiders.exe:
      ascii_mode: true
      vim_mode: true
    vscode.exe:
      ascii_mode: true
      vim_mode: true
    vscode-insiders.exe:
      ascii_mode: true
      vim_mode: true
    cursor.exe:
      ascii_mode: true
      vim_mode: true
    zed.exe:
      ascii_mode: true
      vim_mode: true
    nvim.exe:
      ascii_mode: true
      vim_mode: true
    nvim-qt.exe:
      ascii_mode: true
      vim_mode: true
    gvim.exe:
      ascii_mode: true
      vim_mode: true
    devenv.exe:
      ascii_mode: true
      vim_mode: true
    idea64.exe:
      ascii_mode: true
      vim_mode: true
    pycharm64.exe:
      ascii_mode: true
      vim_mode: true
    webstorm64.exe:
      ascii_mode: true
      vim_mode: true
    clion64.exe:
      ascii_mode: true
      vim_mode: true
    rider64.exe:
      ascii_mode: true
      vim_mode: true
