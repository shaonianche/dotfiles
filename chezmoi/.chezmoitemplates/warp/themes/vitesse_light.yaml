# Vitesse Light for Warp
# Colors from https://github.com/antfu/vscode-theme-vitesse
# Deviation from upstream: `magenta` is Vitesse's purple (#6f42c1, hue 261) so
# that the WSL Debian tab coloured through directory_tab_colors reads as purple
# rather than the upstream rose (#a13865). Applies to ANSI magenta everywhere.
name: Vitesse Light
accent: '#1e754f'
background: '#ffffff'
foreground: '#393a34'
details: lighter
terminal_colors:
  normal:
    black: '#121212'
    red: '#ab5959'
    green: '#1e754f'
    yellow: '#bda437'
    blue: '#296aa3'
    magenta: '#6f42c1'
    cyan: '#2993a3'
    white: '#dbd7ca'
  bright:
    black: '#aaaaaa'
    red: '#ab5959'
    green: '#1e754f'
    yellow: '#bda437'
    blue: '#296aa3'
    magenta: '#6f42c1'
    cyan: '#2993a3'
    white: '#dddddd'
