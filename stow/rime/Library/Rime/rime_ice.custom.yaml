# 雾凇拼音补丁
# 注意：switches 是数组，整段赋值会替换原方案全部开关，
# 因此这里保留完整列表后再改需要的项。
#
# ascii_mode reset: 1 → 新会话 / 方案加载时默认英文（不写入 save_options，避免跨次记忆）
# 终端与编辑器的「进入即英文」另见 weasel / squirrel 的 app_options
patch:
  schema:
    icon: others/zhcn.ico
    ascii_icon: others/a.ico
    full_icon: others/zhcn.ico
    half_icon: others/a.ico

  switches:
    - name: ascii_mode
      states: [ 中, Ａ ]
      reset: 1 # 0=中文 1=英文；新会话默认英文
    - name: ascii_punct
      states: [ ¥, $ ]
    - name: traditionalization
      states: [ 简, 繁 ]
      reset: 0 # 默认简体（0=简，1=繁）
    - name: emoji
      states: [ 💀, 😄 ]
      reset: 1
    - name: full_shape
      states: [ 半角, 全角 ]
    - name: search_single_char
      states: [正常, 单字]
      abbrev: [词, 单]
